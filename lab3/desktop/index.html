<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auraglow</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <div class="top-banner">
            <p class="top-banner__text">
                New look, new products. Available exclusively at Auraglow.com
            </p>
           <button class="top-banner__close">
    <img src="../assets/images/close.png" alt="">
</button>
        </div>

        <div class="hero-area">
            <header class="header">
                <div class="header__row">
                    <a href="#" class="header__logo" aria-label="Auraglow">
    <img src="../assets/images/logo.png" alt="Auraglow" class="header__logo-text">
    <img src="../assets/images/logo-icon.png" alt="" class="header__logo-icon">
</a>

                    <nav class="nav">
                        <a href="#" class="nav__link">Products</a>
                        <a href="#" class="nav__link">Our Story</a>
                        <a href="#" class="nav__link">Reviews</a>
                        <a href="#" class="nav__link">Virtual Mirror</a>
                    </nav>

                    <a href="#" class="cart">
                        <img src="../assets/images/cart-icon.png" alt="Cart">
                    </a>
                </div>
            </header>

            <main class="main">
                <section class="hero">
                    <div class="hero__content">
                        <h1 class="hero__title">Oral care is self care.</h1>
                        <a href="#" class="hero__button">Find your glow</a>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
