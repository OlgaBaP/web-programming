<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auraglow Cart</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/catalog.css" />
    <script src="js/session.js" defer></script>
    <script src="js/cart.js" defer></script>
  </head>

  <body>
    <div class="catalog-page">
      <div class="catalog-top">
        <p class="catalog-top__text">
          New look, new products. Available exclusively at Auraglow.com
        </p>
      </div>

      <header class="catalog-header">
        <a
          href="index.html"
          class="catalog-header__logo"
          aria-label="Auraglow home"
        >
          <img
            src="../assets/images/logo.png"
            alt="Auraglow"
            class="catalog-header__logo-text"
          />
          <img
            src="../assets/images/logo-icon.png"
            alt=""
            class="catalog-header__logo-icon"
          />
        </a>

        <nav class="catalog-nav" aria-label="Main navigation">
          <a href="index.html" class="catalog-nav__link">Home</a>
          <a href="catalog.html" class="catalog-nav__link">Catalog</a>
          <a href="favorites.html" class="catalog-nav__link">Favorites</a>
          <a href="cart.html" class="catalog-nav__link">Cart</a>
          <a href="auth.html" class="catalog-nav__link" data-auth-link
            >Auth / Login</a
          >
          <a href="feedback.html" class="catalog-nav__link">Feedback</a>
          <a href="admin.html" class="catalog-nav__link" data-admin-link hidden
            >Admin</a
          >
          <button
            class="catalog-nav__link catalog-nav__button"
            type="button"
            data-logout-button
            hidden
          >
            Logout
          </button>
        </nav>

        <a href="cart.html" class="catalog-header__cart" aria-label="Cart">
          <img src="../assets/images/cart-icon.png" alt="" />
        </a>
      </header>

      <main class="catalog-main">
        <section class="catalog-hero">
          <p class="catalog-hero__subtitle">Auraglow Cart</p>
          <h1 class="catalog-hero__title">Your shopping cart</h1>
          <p class="catalog-hero__text">
            Change product quantity, remove items or finish your order.
          </p>
        </section>

        <section class="cart-summary" aria-label="Cart summary">
          <p class="cart-summary__total" id="cartTotal">Total: $0</p>
          <button
            class="catalog-card__button"
            type="button"
            id="checkoutButton"
          >
            Checkout
          </button>
          <p class="cart-summary__message" id="cartMessage"></p>
        </section>

        <section class="catalog-list" aria-label="Cart products">
          <div class="catalog__grid" id="cartContainer"></div>
        </section>
      </main>
    </div>
  </body>
</html>
